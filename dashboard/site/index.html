<!--
  ============================================================
  TCF — EXPRESSION ORALE, application de poche

  Pourquoi ce site existe : le micro d'un téléphone n'est donné
  qu'aux pages en HTTPS. Un fichier posé sur le téléphone ne peut
  donc PAS enregistrer. Hébergé (GitHub Pages, HTTPS gratuit),
  tout marche — y compris sur iPhone.

  Ce qui reste privé : les enregistrements ne quittent JAMAIS le
  téléphone. Ils sont gardés dans sa mémoire (IndexedDB). Le site
  n'a pas de serveur, ne reçoit rien, n'envoie rien.
  Pour les récupérer sur l'ordinateur : bouton « Partager ».

  Hors ligne : après la première visite, tout est mis en cache
  (voir sw.js). On peut donc s'entraîner en avion.
  ============================================================
-->
<style>

// Une tâche : préparation et temps de parole, en secondes (vrai barème TCF).
function tache(combi, numero) {
  const sujets = [PRESENTATION, SUJETS[combi][0], SUJETS[combi][1]];
  const preps = [0, 120, 0];
  const durees = [120, 210, 270];
  return { titre: TITRES[numero], sujet: sujets[numero],
           prep: preps[numero], duree: durees[numero], aide: AIDE[numero] };
}

// ============================================================
// MÉMOIRE DU TÉLÉPHONE (IndexedDB)
// Les enregistrements restent ici, dans le téléphone. Rien n'est
// envoyé nulle part : c'est ma voix, elle ne regarde personne.
// ============================================================
const BASE = "tcf-oral";
let bdd = null;

function ouvrirBase() {
  return new Promise((ok, non) => {
    if (bdd) return ok(bdd);
    const r = indexedDB.open(BASE, 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore("enregistrements", { keyPath: "id", autoIncrement: true });
    };
    r.onsuccess = () => { bdd = r.result; ok(bdd); };
    r.onerror = () => non(r.error);
  });
}

function transaction(mode, action) {
  return ouvrirBase().then(db => new Promise((ok, non) => {
    const t = db.transaction("enregistrements", mode);
    const demande = action(t.objectStore("enregistrements"));
    demande.onsuccess = () => ok(demande.result);
    demande.onerror = () => non(demande.error);
  }));
}

const ajouterEnreg = e => transaction("readwrite", s => s.add(e));
const listerEnregs = () => transaction("readonly", s => s.getAll());
const effacerEnreg = id => transaction("readwrite", s => s.delete(id));

  t = Math.max(0, Math.round(t || 0));
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
};
const echapper = t => String(t).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ko = o => o < 1024 * 1024
  ? Math.round(o / 1024) + " Ko" : (o / 1024 / 1024).toFixed(1) + " Mo";

// Safari (iPhone) ne sait faire que du mp4 ; Chrome et Firefox du webm.
// On prend ce que le téléphone sait faire, et on garde l'extension qui va avec.
function formatAudio() {
  const essais = [["audio/mp4", "m4a"], ["audio/webm;codecs=opus", "webm"],
                  ["audio/webm", "webm"], ["audio/ogg;codecs=opus", "ogg"]];
  for (const [type, ext] of essais) {
    try { if (MediaRecorder.isTypeSupported(type)) return { type, ext }; } catch (e) {}
  }
  return { type: "", ext: "m4a" };
}

function nomFichier(combi, numero, date) {
  const d = date ? new Date(date) : new Date(), z = n => String(n).padStart(2, "0");
  return `oral-${combi + 1}_tache-${numero + 1}_`
       + `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}

}

function vueTache() {
  const t = tache(S.combi, S.numero);
  const total = S.phase === "prep" ? t.prep : t.duree;
  const C = 2 * Math.PI * 105;
  const anneau = `
    <div class="anneau ${S.reste <= 30 ? "urgent" : ""}">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <circle class="fond" cx="120" cy="120" r="105"></circle>
        <circle class="trait" cx="120" cy="120" r="105"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (total ? S.reste / total : 0))}"></circle>
      </svg>
      <div class="centre">
        <div class="tps">${mmss(S.reste)}</div>
        <div class="quoi">${S.phase === "prep" ? "préparation" : "temps de parole"}</div>
      </div>
    </div>`;

  const vu = `<div class="vu">${Array.from({ length: 12 }, () =>
    `<div style="height:3px"></div>`).join("")}</div>`;

  let corps = "";

  if (S.phase === "pret") {
    corps = `
      <div class="sujet">${echapper(t.sujet)}</div>
      <p class="doux centrer" style="margin-top:14px">
        ${t.prep ? `${mmss(t.prep)} pour préparer, puis ${mmss(t.duree)} pour parler.
                    L'enregistrement démarre tout seul.`
                 : `${mmss(t.duree)} de parole, sans préparation.`}
      </p>
      <div class="info jaune" style="margin-top:14px">
        🔇 Mets le téléphone en mode silencieux et trouve un endroit
        où tu oses parler fort. C'est ça le plus dur — le reste suit.
      </div>
      <button class="btn" id="go">▶ Commencer</button>
      <button class="btn gris" id="quitter2">← Choisir autre chose</button>`;

  } else if (S.phase === "prep") {
    corps = `
      <div class="centrer"><span class="etat prep">✍️ Préparation</span></div>
      ${anneau}
      <div class="sujet">${echapper(t.sujet)}</div>
      <textarea id="notes" placeholder="Note tes questions, tes idées… (des mots-clés, pas des phrases)">${echapper(S.notes)}</textarea>
      <details><summary>💡 Phrases utiles</summary>
        <div class="aide"><ul>${t.aide.map(a => `<li>${echapper(a)}</li>`).join("")}</ul></div>
      </details>
      <button class="btn" id="parler">🎙️ Je suis prête — parler maintenant</button>`;

  } else if (S.phase === "rec") {
    corps = `
      <div class="centrer"><span class="etat rec"><span class="pt"></span> Enregistrement</span></div>
      ${anneau}
      ${vu}
      <div class="sujet" style="margin-top:14px">${echapper(t.sujet)}</div>
      ${S.notes ? `<div class="carte" style="margin-top:12px">
        <p class="sous" style="margin-bottom:6px">📝 Mes notes</p>
        <div style="white-space:pre-wrap;font-size:15px">${echapper(S.notes)}</div></div>` : ""}
      <button class="btn rouge" id="stop">⏹ J'ai fini de parler</button>`;

  } else {
    corps = `
      <div class="centrer"><span class="etat fini">✅ Enregistré · ${mmss(S.secondes)}</span></div>
      <div class="carte" style="margin-top:14px">
        <h2>Réécoute-toi</h2>
        <p class="sous">C'est là qu'on progresse le plus. Repère les silences et les « euh ».</p>
        ${S.url ? `<audio src="${S.url}" controls preload="metadata"></audio>` : ""}
      </div>
      ${S.message ? `<div class="info vert">${S.message}</div>` : ""}
      <button class="btn" id="suivante">${S.numero < 2 ? `Tâche ${S.numero + 2} ›` : "🏁 Terminer"}</button>
      <div class="ligne" style="margin-top:8px">
        <button class="btn gris mini" id="refaire" style="margin-top:0">🔁 Refaire</button>
        <button class="btn gris mini" id="partager" style="margin-top:0">📤 Partager</button>
      </div>`;
  }

  return `<header>
      <button class="rond" id="quitter">←</button>
      <h1>Tâche ${S.numero + 1} — ${echapper(t.titre)}</h1>
    </header>${corps}`;
}

function vueEnregistrements() {
  if (!S.enregs.length) {
    return `<header><button class="rond" id="quitter">←</button><h1>🎧 Mes enregistrements</h1></header>
      <div class="info bleu">Rien pour l'instant. Fais une tâche et reviens ici.</div>`;
  }
  const total = S.enregs.reduce((s, e) => s + (e.blob ? e.blob.size : 0), 0);
  // Le plus récent en premier : c'est celui qu'on veut réécouter.
  const liste = S.enregs.slice().sort((a, b) => b.date - a.date);
  return `
    <header><button class="rond" id="quitter">←</button><h1>🎧 Mes enregistrements</h1></header>
    ${S.message ? `<div class="info vert">${S.message}</div>` : ""}
    <div class="info bleu">
      <b>Pour les corriger sur l'ordinateur :</b> appuie sur 📤 Partager,
      choisis « Enregistrer dans Fichiers » (ou envoie-les-toi par mail),
      puis sur l'ordinateur : onglet Oral → 📁 Importer un fichier audio.
    </div>
    ${liste.map(e => `
      <div class="carte">
        <h2>Combinaison ${e.combi + 1} — Tâche ${e.numero + 1}</h2>
        <p class="sous">${TITRES[e.numero]} · ${mmss(e.secondes)} · ${ko(e.blob ? e.blob.size : 0)}
          · ${new Date(e.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}</p>
        <audio src="${URL.createObjectURL(e.blob)}" controls preload="none"></audio>
        ${e.notes ? `<details><summary>📝 Mes notes de préparation</summary>
          <div style="white-space:pre-wrap;font-size:14px;padding:8px 0">${echapper(e.notes)}</div></details>` : ""}
        <div class="ligne" style="margin-top:10px">
          <button class="btn gris mini" data-partager="${e.id}" style="margin-top:0">📤 Partager</button>
          <button class="btn gris mini" data-effacer="${e.id}" style="margin-top:0">🗑️ Effacer</button>
        </div>
      </div>`).join("")}
    <p class="doux centrer">${S.enregs.length} enregistrement(s) · ${ko(total)} dans le téléphone</p>`;
}

// ============================================================
// ACTIONS
// ============================================================
function brancher() {
  const clic = (sel, f) => { const e = $(sel); if (e) e.onclick = f; };
  document.querySelectorAll("[data-combi]").forEach(b =>
    b.onclick = () => { S.combi = +b.dataset.combi; S.numero = 0; ouvrirTache(); });
  document.querySelectorAll("[data-solo]").forEach(b =>
    b.onclick = () => { S.numero = +b.dataset.solo; ouvrirTache(); });
  document.querySelectorAll("[data-partager]").forEach(b =>
    b.onclick = () => partagerId(+b.dataset.partager));
  document.querySelectorAll("[data-effacer]").forEach(b =>
    b.onclick = () => supprimer(+b.dataset.effacer));

  clic("#go", commencer);
  clic("#parler", parler);
  clic("#stop", arreter);
  clic("#suivante", suivante);
  clic("#refaire", refaire);
  clic("#partager", () => partagerBlob(S.blob, nomFichier(S.combi, S.numero)));
  clic("#quitter", quitter);
  clic("#quitter2", quitter);
  clic("#voirEnregs", async () => {
    S.enregs = await listerEnregs();
    S.ecran = "enregistrements"; S.message = ""; dessiner();
  });

  const n = $("#notes");
  if (n) n.oninput = e => { S.notes = e.target.value; };
}

function ouvrirTache() {
  S.ecran = "tache"; S.phase = "pret"; S.notes = "";
  S.secondes = 0; S.message = ""; libererUrl();
  dessiner();
}

// Le micro est demandé ICI, au doigt sur « Commencer ».
// Sur iPhone c'est indispensable : Safari n'accorde le micro que
// pendant un geste de l'utilisatrice. Après la préparation, il serait
// trop tard — d'où le flux gardé ouvert pendant tout l'exercice.
async function commencer() {
  const t = tache(S.combi, S.numero);
  const bouton = $("#go");
  if (bouton) { bouton.disabled = true; bouton.textContent = "⏳ Micro…"; }

  try {
    S.flux = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    if (bouton) { bouton.disabled = false; bouton.textContent = "▶ Commencer"; }
    alert("Le micro n'est pas disponible.\n\n" +
      "Sur iPhone : Réglages → Safari → Microphone → Autoriser, puis recharge la page.\n\n" +
      "(" + (e && e.name ? e.name : "erreur") + ")");
    return;
  }

  ecouterNiveau();          // l'AudioContext doit naître dans ce même geste
  await garderEcranAllume();

  if (t.prep > 0) {
    S.phase = "prep"; S.reste = t.prep; lancerMinuteur(); dessiner();
  } else {
    parler();
  }
}

// Démarre le temps de parole. Le micro est déjà ouvert : plus rien à demander.
function parler() {
  const t = tache(S.combi, S.numero);
  clearInterval(S.minuteur);
  const f = formatAudio();
  S.morceaux = [];
  try {
    S.rec = new MediaRecorder(S.flux, f.type ? { mimeType: f.type } : {});
  } catch (e) {
    S.rec = new MediaRecorder(S.flux);
  }
  S.rec.ondataavailable = e => { if (e.data && e.data.size) S.morceaux.push(e.data); };
  S.rec.onstop = finir;
  S.rec.start(1000);        // un bout par seconde : rien n'est perdu si l'app s'endort

  S.phase = "rec"; S.reste = t.duree; S.secondes = 0;
  lancerMinuteur(); dessiner();
}

function lancerMinuteur() {
  clearInterval(S.minuteur);
  S.minuteur = setInterval(() => {
    S.reste--;
    if (S.phase === "rec") S.secondes++;
    if (S.reste > 0) { rafraichirChrono(); return; }
    S.reste = 0;
    clearInterval(S.minuteur);
    if (S.phase === "prep") parler();   // enchaînement automatique, comme à l'examen
    else arreter();
  }, 1000);
}

// Tout redessiner chaque seconde ferait perdre le clavier pendant la
// préparation : on ne retouche que le chrono.
function rafraichirChrono() {
  const tps = $(".anneau .tps");
  if (!tps) { dessiner(); return; }
  const t = tache(S.combi, S.numero);
  const total = S.phase === "prep" ? t.prep : t.duree;
  tps.textContent = mmss(S.reste);
  $(".anneau .trait").style.strokeDashoffset =
    2 * Math.PI * 105 * (1 - (total ? S.reste / total : 0));
  $(".anneau").classList.toggle("urgent", S.reste <= 30);
}

function arreter() {
  clearInterval(S.minuteur);
  if (S.rec && S.rec.state !== "inactive") S.rec.stop();   // suite dans finir()
  else { S.phase = "fini"; relacherEcran(); dessiner(); }
}

async function finir() {
  const type = (S.rec && S.rec.mimeType) || formatAudio().type || "audio/mp4";
  S.blob = new Blob(S.morceaux, { type });
  S.morceaux = [];
  libererUrl();
  if (S.blob.size) S.url = URL.createObjectURL(S.blob);
  arreterMicro();
  relacherEcran();
  S.phase = "fini";

  if (S.blob.size) {
    try {
      await ajouterEnreg({
        combi: S.combi, numero: S.numero, blob: S.blob,
        secondes: S.secondes, notes: S.notes, date: Date.now(),
      });
      S.enregs = await listerEnregs();
      S.message = "💾 Gardé dans le téléphone — tu le retrouveras dans « Mes enregistrements ».";
    } catch (e) {
      S.message = "⚠️ Impossible de le garder (mémoire pleine ?). Partage-le tout de suite.";
    }
  } else {
    S.message = "⚠️ Rien n'a été capté. Vérifie que le micro est autorisé.";
  }
  dessiner();
}

function refaire() {
  S.phase = "pret"; S.notes = ""; S.message = ""; libererUrl(); dessiner();
}

function suivante() {
  libererUrl();
  if (S.numero < 2) { S.numero++; ouvrirTache(); }
  else quitter();
}

function quitter() {
  if (S.phase === "rec" && !confirm("Tu es en train de parler. Quitter maintenant ?")) return;
  clearInterval(S.minuteur);
  arreterMicro(); relacherEcran(); libererUrl();
  S.ecran = "accueil"; S.phase = "pret"; S.message = "";
  listerEnregs().then(l => { S.enregs = l; dessiner(); }).catch(() => dessiner());
}

async function supprimer(id) {
  const e = S.enregs.find(x => x.id === id);
  if (!e) return;
  if (!confirm(`Effacer l'enregistrement de la tâche ${e.numero + 1} ?`)) return;
  await effacerEnreg(id);
  S.enregs = await listerEnregs();
  S.message = "Effacé.";
  dessiner();
}

function partagerId(id) {
  const e = S.enregs.find(x => x.id === id);
  if (e) partagerBlob(e.blob, nomFichier(e.combi, e.numero, e.date));
}

// « Partager » = la feuille iOS : Enregistrer dans Fichiers, AirDrop, Mail…
// C'est le chemin le plus simple pour ramener l'audio sur l'ordinateur.
async function partagerBlob(blob, base) {
  if (!blob) return;
  const ext = blob.type.indexOf("mp4") !== -1 ? "m4a"
            : blob.type.indexOf("ogg") !== -1 ? "ogg" : "webm";
  const fichier = new File([blob], `${base}.${ext}`, { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      await navigator.share({ files: [fichier], title: fichier.name });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;   // partage annulé : normal
  }
  // Repli (ordinateur, vieux navigateurs) : téléchargement classique.
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fichier.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// ---------- Micro ----------
function ecouterNiveau() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx || !S.flux) return;
  S.ctx = new Ctx();
  if (S.ctx.state === "suspended") S.ctx.resume();   // iOS démarre en pause
  S.analyseur = S.ctx.createAnalyser();
  S.analyseur.fftSize = 512;
  S.ctx.createMediaStreamSource(S.flux).connect(S.analyseur);
  const donnees = new Uint8Array(S.analyseur.fftSize);
  const boucle = () => {
    S.analyseur.getByteTimeDomainData(donnees);
    let max = 0;
    for (let i = 0; i < donnees.length; i++) {
      const v = Math.abs(donnees[i] - 128);
      if (v > max) max = v;
    }
    S.niveau += (Math.min(1, max / 55) - S.niveau) * 0.4;
    const barres = document.querySelectorAll(".vu > div");
    barres.forEach((b, i) => {
      const forme = 0.45 + 0.55 * Math.sin((i / (barres.length - 1)) * Math.PI);
      b.style.height = Math.max(3, Math.round(3 + S.niveau * 30 * forme)) + "px";
      b.classList.toggle("on", S.niveau > 0.08);
    });
    S.anim = requestAnimationFrame(boucle);
  };
  boucle();
}

function arreterMicro() {
  if (S.anim) { cancelAnimationFrame(S.anim); S.anim = null; }
  if (S.ctx) { S.ctx.close().catch(() => {}); S.ctx = null; }
  if (S.flux) { S.flux.getTracks().forEach(p => p.stop()); S.flux = null; }
  S.analyseur = null; S.niveau = 0;
}

function libererUrl() {
  if (S.url) { URL.revokeObjectURL(S.url); S.url = ""; }
  S.blob = null;
}

// ---------- Écran ----------
// Un chrono de 4 min 30 ne sert à rien si l'écran s'éteint au bout d'une minute.
async function garderEcranAllume() {
  try { if (navigator.wakeLock) S.veille = await navigator.wakeLock.request("screen"); }
  catch (e) { /* non supporté : l'écran s'éteindra, ce n'est pas bloquant */ }
}
function relacherEcran() {
  if (S.veille) { S.veille.release().catch(() => {}); S.veille = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.ecran === "tache"
      && (S.phase === "prep" || S.phase === "rec")) garderEcranAllume();
});

// ---------- Démarrage ----------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("sw.js").catch(() => {}));
}
// On dessine TOUT DE SUITE, sans attendre la mémoire du téléphone : si
// IndexedDB est lent ou bloqué (navigation privée sur iPhone), on aurait
// un écran blanc. La liste des enregistrements arrive juste après.
dessiner();
listerEnregs().then(l => { S.enregs = l; dessiner(); }).catch(() => {});
</script>
